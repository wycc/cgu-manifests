apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The v53 exporter (markjiang10/cgu-monitor:v53, Deployment node-resource-monitor,
# Services prom-app and node-resource-monitor) was retired on 2026-11-20; v71 replaces it.
# kubectl apply does not prune, so a cluster that still runs v53 needs the cleanup
# steps in v71/README.md.
resources:
- v71
